name: Build watch app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && xcrun --sdk watchos --show-sdk-version

      - name: Build for watchOS simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project SleepSound.xcodeproj -scheme SleepSound \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build for real watch (no signing)
        run: |
          set -o pipefail
          xcodebuild -project SleepSound.xcodeproj -scheme SleepSound \
            -destination 'generic/platform=watchOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-device.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build*.log
