name: SleepSound
options:
  bundleIdPrefix: com.jjjj8
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SleepSound:
    type: application
    platform: watchOS
    sources:
      - path: SleepSound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjjj8.sleepsound.watchkitapp
        PRODUCT_NAME: SleepSound
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
    info:
      path: SleepSound/Info.plist
      properties:
        CFBundleDisplayName: 睡眠录音
        WKApplication: true
        WKWatchOnly: true
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: 需要使用麦克风整晚录下睡眠时的声音，用来检测打鼾。录音只保存在你的手表上。
        UIBackgroundModes:
          - audio
    scheme: {}
